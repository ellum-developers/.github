name: Supply-chain guard

on:
  push:
    branches: [main, master, develop, dev, staging]
  pull_request:
  schedule:
    # Daily, so a payload committed to a quiet repo still surfaces within a day.
    - cron: '19 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Pin to a full commit SHA of the reusable workflow — never a branch or a
    # moving tag. The guard reads its scanner from that same commit, so a pinned
    # ref fixes both the rules and the runner. Replace the placeholder with the
    # current SHA from https://github.com/ellum-developers/.github/commits/main
    uses: ellum-developers/.github/.github/workflows/supply-chain-guard.yml@<FULL_COMMIT_SHA>
